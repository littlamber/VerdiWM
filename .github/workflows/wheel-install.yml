name: wheel-install

on:
  push:
  pull_request:
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolved-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --locked --group dev
      - run: uv build --wheel --out-dir dist
      - name: Resolve wheel dependencies without repository lock
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uv run --frozen --no-sync python scripts/ci/check_installed_wheel.py "${wheels[0]}" --dependency-mode resolved --report artifacts/release/online_install.json
