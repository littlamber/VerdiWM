name: control-plane-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verdiwm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.12.10
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Prepare hashed dependency cache for offline installation
        env:
          UV_OFFLINE: "0"
        run: uv run --frozen --no-sync python scripts/ci/check_installed_wheel.py --prepare-locked-cache
      - name: Run control-plane harness
        env:
          UV_OFFLINE: "1"
        run: bash scripts/ci/check_control_plane.sh
