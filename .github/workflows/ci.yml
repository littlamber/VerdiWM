name: control-plane-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verdiwm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.12.10
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Prepare hashed dependency cache for offline installation
        env:
          UV_OFFLINE: "0"
        run: uv run --frozen --no-sync python scripts/ci/check_installed_wheel.py --prepare-locked-cache
      - name: Run control-plane harness
        env:
          UV_OFFLINE: "1"
        run: bash scripts/ci/check_control_plane.sh
