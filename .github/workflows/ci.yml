name: control-plane-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verdiwm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run control-plane harness
        run: bash scripts/ci/check_control_plane.sh
