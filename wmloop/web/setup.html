<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VerdiWM 首次设置</title><link rel="stylesheet" href="/assets/setup.css"></head>
<body><main class="setup"><p class="eyebrow">VerdiWM</p><h1>开始你的第一次研究</h1><p class="lead">只需要告诉系统模型、数据和想改善的能力。系统会先检查输入，再决定下一步。</p>
<form id="setup-form"><label>模型目录<input name="model" placeholder="例如：./model" required></label><label>数据目录<input name="data" placeholder="例如：./data 或 ./dataset" required></label><label>研究目标<textarea name="goal" placeholder="例如：提升长时域预测稳定性" required></textarea></label><label>希望提升的指标（可选）<input name="target_metrics" placeholder="例如：psnr runtime_ready"></label><details><summary>运行与评测（可以稍后补充）</summary><label>模型 Python<input name="runtime_python" placeholder="例如：./model/.venv/bin/python"></label><label>评测契约<input name="evaluator_contract" placeholder="例如：./contracts/evaluator.json"></label></details><button type="submit">保存并检查接入状态</button><p id="message" role="alert"></p><section id="readiness" hidden><h2>接入检查</h2><ul id="blockers"></ul><p id="next-step"></p><a href="/">进入工作台</a></section></form></main><script src="/assets/setup.js"></script></body></html>
