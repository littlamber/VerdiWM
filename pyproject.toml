[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "verdiwm"
version = "0.1.0"
description = "Evidence-grounded diagnosis, repair, and transfer for world models."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["world-models", "automated-research", "diagnosis", "causal-transfer"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "tenacity>=9,<10",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[project.scripts]
verdiwm-backbone-audit = "wmloop.control.backbone_instance:main"
verdiwm-capability-matrix = "wmloop.control.backbone_capability_matrix:main"

[tool.hatch.build.targets.wheel]
packages = ["wmloop"]

[tool.hatch.build.targets.wheel.force-include]
configs = "configs"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
