[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "verdiwm-clean"
version = "0.1.0"
description = "Lightweight model-agnostic research control plane for world-model experiments."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pypdf>=5,<7",
  "trafilatura>=1.12,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "respx>=0.21,<1"]

[project.scripts]
verdi = "verdi_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["verdi_core", "adapters"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
