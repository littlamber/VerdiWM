[build-system]
requires = ["hatchling==1.33.0", "packaging==26.3", "pathspec==1.1.1", "pluggy==1.6.0", "trove-classifiers==2026.6.1.19"]
build-backend = "hatchling.build"

[project]
name = "verdiwm"
version = "1.0.4rc1"
description = "Evidence-grounded diagnosis, repair, and transfer for world models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["world-models", "automated-research", "diagnosis", "causal-transfer"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: POSIX :: Linux",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "imageio[ffmpeg]>=2.34,<3",
  "jsonschema>=4.23,<5",
  "numpy>=1.26,<3",
  "packaging>=26.2,<27",
  "Pillow>=13,<14",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "cryptography>=50.0.2,<51",
  "tenacity>=9,<10",
  "tomli>=2,<3",
]

[dependency-groups]
dev = ["pytest>=9.1.1,<10"]
torch-tests = ["torch>=2.2,<3"]

[project.urls]
Repository = "https://github.com/littlamber/VerdiWM"
Issues = "https://github.com/littlamber/VerdiWM/issues"
Security = "https://github.com/littlamber/VerdiWM/security/policy"

[project.scripts]
verdiwm-auto-experiment = "wmloop.execute.auto_experiment:main"
verdiwm-auto-scheduler = "wmloop.execute.experiment_scheduler:main"
verdiwm-effect-label-queue = "wmloop.experiments.effect_label_queue:main"
verdi = "wmloop.cli:main"
verdiwm = "wmloop.cli:main"
verdiwm-backbone-audit = "wmloop.control.backbone_instance:main"
verdiwm-capability-matrix = "wmloop.control.backbone_capability_matrix:main"
verdiwm-cpbe = "wmloop.experiments.cpbe:main"
verdiwm-onboard = "wmloop.control.onboarding:main"
verdiwm-conformance = "wmloop.control.onboarding_conformance:main"
verdiwm-compile-candidates = "wmloop.control.onboarding_compiler:main"
verdiwm-run = "wmloop.execute.autonomous_pipeline:main"
verdiwm-run-daemon = "wmloop.execute.pipeline_daemon:main"
verdiwm-evolution-daemon = "wmloop.execute.evolution_daemon:main"
verdiwm-literature-search = "wmloop.retrieve.literature:main"
verdiwm-literature-method-stage = "wmloop.retrieve.method_staging:main"
verdiwm-mechanism-discovery = "wmloop.retrieve.mechanism_discovery:main"
verdiwm-campaign-daemon = "wmloop.execute.campaign_daemon:main"
verdiwm-campaign-api = "wmloop.control.campaign_api:main"
verdiwm-evidence-graph = "wmloop.experiments.evidence_graph:main"
verdiwm-campaign-dispatcher = "wmloop.control.campaign_dispatcher:main"
verdiwm-constitution-proposal = "wmloop.control.constitution_proposal:main"
verdiwm-materialize-method = "wmloop.execute.automatic_materialization:main"
verdiwm-open-method-study = "wmloop.control.open_method_study:main"
verdiwm-generate-method = "wmloop.control.open_method_generation:main"
verdiwm-calibrate-method = "wmloop.control.method_calibration:main"
verdiwm-run-open-method-study = "wmloop.execute.open_method_study_runner:main"
verdiwm-ctrl-world-autonomous-transfer = "experiments.ctrl_world_autonomous_transfer_v1.controller:main"
verdiwm-artifact-lint = "wmloop.experiments.artifact_lint:main"
verdiwm-job = "wmloop.execute.job_supervisor:main"
verdiwm-workbench = "wmloop.control.workbench:main"

[tool.hatch.build.targets.wheel]
packages = ["wmloop"]
exclude = ["/wmloop/web/ui"]

[tool.hatch.build.targets.wheel.force-include]
configs = "configs"
"scripts/evaluate_psnr_ssim_smoke.py" = "scripts/evaluate_psnr_ssim_smoke.py"
"experiments/ctrl_world_autonomous_transfer_v1" = "experiments/ctrl_world_autonomous_transfer_v1"
"experiments/ctrl_world_hybrid_memory_transfer_v1" = "experiments/ctrl_world_hybrid_memory_transfer_v1"
"experiments/ctrl_world_research_loop_v2" = "experiments/ctrl_world_research_loop_v2"
"experiments/ctrl_world_acwm_guidance_v1" = "experiments/ctrl_world_acwm_guidance_v1"
"experiments/wan22_droid_acwm_v1" = "experiments/wan22_droid_acwm_v1"

[tool.hatch.build.targets.sdist]
include = [
  "/configs",
  "/experiments/ctrl_world_autonomous_transfer_v1",
  "/experiments/ctrl_world_hybrid_memory_transfer_v1",
  "/experiments/ctrl_world_research_loop_v2",
  "/experiments/ctrl_world_acwm_guidance_v1",
  "/experiments/wan22_droid_acwm_v1",
  "/CONTRIBUTING.md",
  "/AGENTS.md",
  "/CITATION.cff",
  "/CHANGELOG.md",
  "/docs",
  "/LICENSE",
  "/pyproject.toml",
  "/README.md",
  "/README_zh.md",
  "/scripts",
  "/SECURITY.md",
  "/THIRD_PARTY_NOTICES.md",
  "/tests",
  "/uv.lock",
  "/wmloop",
  "/examples/portrait_first_minimal_loop_v1",
]
exclude = ["/wmloop/web/ui", "/docs/plans", "/docs/summary", "/docs/prompts", "/docs/logs", "**/.env", "**/.env.*", "**/*.pem", "**/*.key"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
constraint-dependencies = ["filelock>=4.2.10", "setuptools>=84.2.1"]
