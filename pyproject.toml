[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "verdiwm"
version = "0.1.0"
description = "Evidence-grounded diagnosis, repair, and transfer for world models."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["world-models", "automated-research", "diagnosis", "causal-transfer"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "imageio[ffmpeg]>=2.34,<3",
  "jsonschema>=4.23,<5",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "tenacity>=9,<10",
]

[dependency-groups]
dev = ["pytest>=8,<9"]
torch-tests = ["torch>=2.2,<3"]

[project.scripts]
verdiwm = "wmloop.cli:main"
verdiwm-backbone-audit = "wmloop.control.backbone_instance:main"
verdiwm-capability-matrix = "wmloop.control.backbone_capability_matrix:main"
verdiwm-acwm-cpbe-bootstrap = "wmloop.experiments.acwm_cpbe_bootstrap:main"
verdiwm-acwm-cpbe-canary = "wmloop.experiments.acwm_cpbe_canary:main"
verdiwm-cpbe = "wmloop.experiments.cpbe:main"
verdiwm-cpbe-learn = "wmloop.experiments.cpbe_counterexample:main"
verdiwm-cpbe-materialize = "wmloop.experiments.cpbe_materializer:main"
verdiwm-cpbe-stage = "wmloop.experiments.cpbe_stage_runner:main"
verdiwm-experiment-plan = "wmloop.experiments.lobo:main"
verdiwm-experiment-report = "wmloop.experiments.report:main"
verdiwm-auto-experiment = "wmloop.execute.auto_experiment:main"
verdiwm-auto-scheduler = "wmloop.execute.experiment_scheduler:main"
verdiwm-onboard = "wmloop.control.onboarding:main"
verdiwm-conformance = "wmloop.control.onboarding_conformance:main"
verdiwm-compile-candidates = "wmloop.control.onboarding_compiler:main"
verdiwm-run = "wmloop.execute.autonomous_pipeline:main"
verdiwm-run-daemon = "wmloop.execute.pipeline_daemon:main"
verdiwm-evolution-daemon = "wmloop.execute.evolution_daemon:main"
verdiwm-literature-search = "wmloop.retrieve.literature:main"
verdiwm-literature-method-stage = "wmloop.retrieve.method_staging:main"
verdiwm-mechanism-discovery = "wmloop.retrieve.mechanism_discovery:main"
verdiwm-campaign-daemon = "wmloop.execute.campaign_daemon:main"
verdiwm-campaign-api = "wmloop.control.campaign_api:main"
verdiwm-evidence-graph = "wmloop.experiments.evidence_graph:main"
verdiwm-campaign-dispatcher = "wmloop.control.campaign_dispatcher:main"

[tool.hatch.build.targets.wheel]
packages = ["wmloop"]

[tool.hatch.build.targets.wheel.force-include]
configs = "configs"
"scripts/aggregate_ctrl_world_local_fingerprint.py" = "scripts/aggregate_ctrl_world_local_fingerprint.py"
"scripts/evaluate_ctrl_world_anchor_repair_confirm.py" = "scripts/evaluate_ctrl_world_anchor_repair_confirm.py"
"scripts/freeze_ctrl_world_directional_selector.py" = "scripts/freeze_ctrl_world_directional_selector.py"
"scripts/run_ctrl_world_anchor_repair_candidate.py" = "scripts/run_ctrl_world_anchor_repair_candidate.py"
"scripts/run_ctrl_world_anchor_repair_screen.py" = "scripts/run_ctrl_world_anchor_repair_screen.py"
"scripts/run_ctrl_world_local_fingerprint_probe.py" = "scripts/run_ctrl_world_local_fingerprint_probe.py"
"scripts/settle_ctrl_world_anchor_repair_screen.py" = "scripts/settle_ctrl_world_anchor_repair_screen.py"

[tool.hatch.build.targets.sdist]
include = [
  "/configs",
  "/CONTRIBUTING.md",
  "/docs",
  "/LICENSE",
  "/pyproject.toml",
  "/README.md",
  "/README_zh.md",
  "/scripts",
  "/SECURITY.md",
  "/tests",
  "/uv.lock",
  "/wmloop",
]
exclude = [
  "/docs/CTRL_WORLD_CONSERVATIVE_DISTRIBUTIONAL_RESIDUAL_POLICY_WORK_ORDER.md",
  "/docs/CTRL_WORLD_FINGERPRINT_SIGNED_HISTORY_WORK_ORDER.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
